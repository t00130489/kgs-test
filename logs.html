<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログ | kgs-test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    h1 {
      color: #667eea;
      margin-bottom: 1rem;
      text-align: center;
    }
    .header-controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .header-controls button {
      padding: 0.6rem 1.2rem;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.3s;
    }
    .header-controls button:hover {
      background: #764ba2;
    }
    .header-controls button.secondary {
      background: #e0e0e0;
      color: #333;
    }
    .header-controls button.secondary:hover {
      background: #d0d0d0;
    }
    .search-input {
      padding: 0.6rem 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 200px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card h3 {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 0.5rem;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: bold;
    }
    .view-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn {
      padding: 0.5rem 1.1rem; border: 1px solid #ccd3dc; background: #fff;
      color: #37414d; border-radius: 6px; cursor: pointer; font-size: 0.95rem;
    }
    .tab-btn.active { background: #004ea2; border-color: #004ea2; color: #fff; font-weight: 600; }
    .rate-bad { color: #c62828; font-weight: 700; }
    .rate-mid { color: #8a5a00; font-weight: 600; }
    .rate-good { color: #2e7d32; }
    .q-text { max-width: 34em; }
    .num-cell { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .logs-table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    thead {
      background: #f5f7fa;
    }
    th {
      padding: 1rem;
      text-align: left;
      font-weight: 600;
      color: #667eea;
      border-bottom: 2px solid #e0e0e0;
    }
    td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #f0f0f0;
    }
    tr:hover {
      background: #f9f9f9;
    }
    .room-id {
      font-weight: 600;
      color: #667eea;
    }
    .participants {
      font-size: 0.9rem;
      color: #666;
    }
    .winner {
      background: #fff8e1;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      color: #f57c00;
    }
    .mode {
      display: inline-block;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .mode.input {
      background: #c8e6c9;
      color: #2e7d32;
    }
    .mode.select {
      background: #bbdefb;
      color: #1565c0;
    }
    .timestamp {
      font-size: 0.85rem;
      color: #999;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #999;
    }
    .empty-state h2, .loading-state h2 {
      margin-bottom: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .expand-btn {
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
    }
    .details-row {
      display: none;
    }
    .details-row.show {
      display: table-row;
    }
    .details-cell {
      padding: 1rem;
      background: #f9f9f9;
    }
    .details-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    th.sortable {
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    th.sortable:hover {
      background: #e8ebf0;
    }
    .sort-icon {
      font-size: 0.8rem;
      margin-left: 0.2rem;
      color: #999;
    }
    th.sortable.active .sort-icon {
      color: #667eea;
    }
    @media (max-width: 768px) {
      .details-content {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 1rem;
      }
      .header-controls {
        flex-direction: column;
      }
      .search-input {
        width: 100%;
      }
      table {
        font-size: 0.85rem;
      }
      th, td {
        padding: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 ゲームログ</h1>
    
    <div class="header-controls">
      <input type="text" class="search-input" id="searchInput" placeholder="ルームID または プレイヤー名で検索">
      <input type="date" class="search-input" id="startDate" title="開始日">
      <span>〜</span>
      <input type="date" class="search-input" id="endDate" title="終了日">
      <button class="secondary" id="exportBtn">📥 CSV エクスポート</button>
    </div>

    <div class="view-tabs">
      <button class="tab-btn active" data-view="games">試合ログ</button>
      <button class="tab-btn" data-view="questions">問題別成績</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="logs-table-wrapper" id="questionsWrapper" style="display: none;">
      <table id="questionsTable">
        <thead>
          <tr>
            <th>章</th>
            <th>問題</th>
            <th>正解</th>
            <th class="sortable" data-qsort="asked">出題 <span class="sort-icon"></span></th>
            <th class="sortable active" data-qsort="rate">正答率 <span class="sort-icon">▲</span></th>
            <th>誤答</th>
            <th>時間切れ</th>
            <th class="sortable" data-qsort="avgMs">平均解答 <span class="sort-icon"></span></th>
          </tr>
        </thead>
        <tbody id="questionsBody"></tbody>
      </table>
      <div class="empty-state" id="questionsEmpty" style="display: none;">
        <h2>まだ問題別の記録がありません</h2>
        <p>ゲームが1回終わると集計されます。</p>
      </div>
    </div>

    <div class="logs-table-wrapper" id="gamesWrapper">
      <table id="logsTable" style="display: none;">
        <thead>
          <tr>
            <th></th>
            <th class="sortable active" data-sort="date">日時 <span class="sort-icon">▼</span></th>
            <th class="sortable" data-sort="roomId">ルームID <span class="sort-icon"></span></th>
            <th class="sortable" data-sort="host">ホスト <span class="sort-icon"></span></th>
            <th class="sortable" data-sort="participantsCount">参加人数 <span class="sort-icon"></span></th>
            <th class="sortable" data-sort="winner">優勝者 <span class="sort-icon"></span></th>
            <th class="sortable" data-sort="questions">問題数 <span class="sort-icon"></span></th>
            <th class="sortable" data-sort="mode">形式 <span class="sort-icon"></span></th>
            <th class="sortable" data-sort="status">ステータス <span class="sort-icon"></span></th>
          </tr>
        </thead>
        <tbody id="logsBody"></tbody>
      </table>
    </div>

    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <h2>ゲームログを読み込んでいます...</h2>
    </div>

    <div class="empty-state" id="emptyState" style="display: none;">
      <h2>ゲームログがまだ記録されていません</h2>
      <p>ゲームをはじめてみましょう！</p>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const exportBtn = document.getElementById('exportBtn');
    const statsDiv = document.getElementById('stats');
    const logsTable = document.getElementById('logsTable');
    const logsBody = document.getElementById('logsBody');
    const emptyState = document.getElementById('emptyState');
    const loadingState = document.getElementById('loadingState');
    
    let currentSort = { key: 'date', order: 'desc' };
    let currentQSort = { key: 'rate', order: 'asc' };
    let currentQuestionStats = [];
    let currentView = 'games';

    const API = 'https://us-central1-kgs-test-68924.cloudfunctions.net';
    const CHAPTER_NAMES = ['序章','第一章','第二章','第三章','第四章','第五章','第六章','第七章'];
    const GRAD_CHAPTERS = [0, 1, 4, 7];
    const STATUS_LABEL = { incomplete: '途中終了', 'in-progress': '進行中', finished: '終了' };
    const STATUS_STYLE = {
      incomplete: 'background:#ffcccc;color:#c00;',
      'in-progress': 'background:#e3f2fd;color:#1976d2;',
      finished: 'background:#c8e6c9;color:#2e7d32;'
    };

    // --- DOM 生成ヘルパー（ニックネームなどユーザー入力を innerHTML に載せない） ---
    function td(text, cls) {
      const n = document.createElement('td');
      if (cls) n.className = cls;
      n.textContent = text == null ? '' : String(text);
      return n;
    }
    function span(text, cls) {
      const n = document.createElement('span');
      if (cls) n.className = cls;
      n.textContent = text == null ? '' : String(text);
      return n;
    }
    function h4(text) { const n = document.createElement('h4'); n.textContent = text; return n; }
    function p(text) { const n = document.createElement('p'); n.textContent = text; return n; }
    function statusBadge(status) {
      const n = span(STATUS_LABEL[status] || '終了');
      n.setAttribute('style',
        (STATUS_STYLE[status] || STATUS_STYLE.finished) +
        'padding:0.3rem 0.6rem;border-radius:4px;font-size:0.85rem;font-weight:600;');
      return n;
    }
    // 出題範囲を章名で表示する（アプリ側の表記に合わせる）
    function formatChapters(chapters) {
      const chs = (chapters || []).map(Number).filter(n => Number.isFinite(n)).sort((a, b) => a - b);
      if (!chs.length) return '-';
      if (chs.length === CHAPTER_NAMES.length) return '全範囲';
      const g = [...GRAD_CHAPTERS].sort((a, b) => a - b);
      if (chs.length === g.length && chs.every((v, i) => v === g[i])) return '大学院の範囲';
      return chs.map(c => CHAPTER_NAMES[c] || c).join('、');
    }

    // API からゲームログを取得
    async function fetchLogs() {
      try {
        const response = await fetch(API + '/getGameLogs?limit=100');
        if (!response.ok) throw new Error('Failed to fetch logs');
        const data = await response.json();
        return data.logs || [];
      } catch (e) {
        console.error('Error fetching logs:', e);
        return [];
      }
    }

    // テーブルを再描画
    function renderTable(logs) {
      logsBody.innerHTML = '';
      loadingState.style.display = 'none';

      if (logs.length === 0) {
        logsTable.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      logsTable.style.display = 'table';
      emptyState.style.display = 'none';
      logs.forEach((log) => {
        const date = new Date(log.createdAt || log.finishedAt);
        const timeStr = date.toLocaleString('ja-JP');
        const winners = log.winners || [];
        const participantsCount = log.participants ? log.participants.length : 0;
        const hostName = log.host || (log.participants && log.participants.length > 0 ? log.participants[0] : '-');
        
        const statusText = STATUS_LABEL[log.status] || '終了';

        const isUnfinished = log.status === 'incomplete' || log.status === 'in-progress';

        // ニックネームはユーザー入力なので、HTML文字列ではなく DOM で組み立てる
        const mainRow = document.createElement('tr');
        const expandCell = document.createElement('td');
        const expandBtn = document.createElement('button');
        expandBtn.className = 'expand-btn';
        expandBtn.textContent = '▼';
        expandCell.appendChild(expandBtn);
        mainRow.appendChild(expandCell);
        mainRow.appendChild(td(timeStr, 'timestamp'));
        mainRow.appendChild(td(log.roomId, 'room-id'));
        mainRow.appendChild(td(hostName));
        mainRow.appendChild(td(`${participantsCount}人`));
        const winnerCell = document.createElement('td');
        winnerCell.appendChild(span(isUnfinished ? 'ー' : (winners.join(', ') || 'なし'), 'winner'));
        mainRow.appendChild(winnerCell);
        mainRow.appendChild(td(log.questionsCount));
        const modeCell = document.createElement('td');
        modeCell.appendChild(span(log.mode === 'select' ? '選択' : '入力', 'mode ' + (log.mode || 'input')));
        mainRow.appendChild(modeCell);
        const statusCell = document.createElement('td');
        statusCell.appendChild(statusBadge(log.status));
        mainRow.appendChild(statusCell);

        // 詳細情報の行
        const detailsRow = document.createElement('tr');
        detailsRow.className = 'details-row';
        const detailsCell = document.createElement('td');
        detailsCell.colSpan = 9;
        const cell = document.createElement('div');
        cell.className = 'details-cell';
        const content = document.createElement('div');
        content.className = 'details-content';

        const left = document.createElement('div');
        left.appendChild(h4('参加者'));
        left.appendChild(p((log.participants || []).join(', ') || '-'));
        content.appendChild(left);

        const right = document.createElement('div');
        right.appendChild(h4('ゲーム情報'));
        right.appendChild(p('範囲: ' + formatChapters(log.chapters)));
        right.appendChild(p(`問題数: ${log.questionsCount}問`));
        right.appendChild(p('開始: ' + new Date(log.createdAt).toLocaleString('ja-JP')));
        right.appendChild(p('ステータス: ' + statusText));
        content.appendChild(right);

        // 問題別の内訳（記録がある試合のみ）
        if (Array.isArray(log.questions) && log.questions.length) {
          const qb = document.createElement('div');
          qb.appendChild(h4('問題別'));
          const ul = document.createElement('ul');
          ul.style.margin = '0';
          ul.style.paddingLeft = '1.2em';
          log.questions.forEach(q => {
            const li = document.createElement('li');
            const who = q.winner ? `${q.winner} が正解` : (q.unanswered ? '誰も回答せず' : '正解者なし');
            const extra = [];
            if (q.wrong) extra.push(`誤答${q.wrong}`);
            if (q.timeout) extra.push(`時間切れ${q.timeout}`);
            if (q.ms != null) extra.push(`${(q.ms / 1000).toFixed(1)}秒`);
            li.textContent = `第${q.i + 1}問 [${CHAPTER_NAMES[q.chapter] || q.chapter}] ${who}`
              + (extra.length ? `（${extra.join(' / ')}）` : '');
            ul.appendChild(li);
          });
          qb.appendChild(ul);
          content.appendChild(qb);
        }

        cell.appendChild(content);
        detailsCell.appendChild(cell);
        detailsRow.appendChild(detailsCell);

        expandBtn.addEventListener('click', (e) => {
          e.preventDefault();
          detailsRow.classList.toggle('show');
        });

        logsBody.appendChild(mainRow);
        logsBody.appendChild(detailsRow);
      });
    }

    // --- 問題別成績 ---
    async function fetchQuestionStats() {
      try {
        const res = await fetch(API + '/getQuestionStats?limit=1000');
        if (!res.ok) throw new Error('failed');
        const data = await res.json();
        return data.stats || [];
      } catch (e) {
        console.error('Error fetching question stats:', e);
        return [];
      }
    }

    function sortQuestionStats(stats) {
      const dir = currentQSort.order === 'asc' ? 1 : -1;
      const key = currentQSort.key;
      return [...stats].sort((a, b) => {
        let av, bv;
        if (key === 'rate') { av = a.correctRate == null ? 2 : a.correctRate; bv = b.correctRate == null ? 2 : b.correctRate; }
        else if (key === 'avgMs') { av = a.avgMs == null ? Infinity : a.avgMs; bv = b.avgMs == null ? Infinity : b.avgMs; }
        else { av = a[key] || 0; bv = b[key] || 0; }
        if (av === bv) return (b.asked || 0) - (a.asked || 0);
        return av < bv ? -dir : dir;
      });
    }

    function renderQuestionStats(stats) {
      const body = document.getElementById('questionsBody');
      const table = document.getElementById('questionsTable');
      const empty = document.getElementById('questionsEmpty');
      body.innerHTML = '';
      if (!stats.length) {
        table.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      table.style.display = 'table';
      empty.style.display = 'none';
      sortQuestionStats(stats).forEach(s => {
        const tr = document.createElement('tr');
        tr.appendChild(td(CHAPTER_NAMES[s.chapter] || s.chapter));
        tr.appendChild(td(s.question, 'q-text'));
        tr.appendChild(td(s.answer));
        tr.appendChild(td(s.asked, 'num-cell'));
        const rateCell = document.createElement('td');
        rateCell.className = 'num-cell';
        if (s.correctRate == null) {
          rateCell.textContent = '-';
        } else {
          const pct = Math.round(s.correctRate * 100);
          rateCell.appendChild(span(pct + '%',
            pct < 40 ? 'rate-bad' : (pct < 70 ? 'rate-mid' : 'rate-good')));
        }
        tr.appendChild(rateCell);
        tr.appendChild(td(s.wrong, 'num-cell'));
        tr.appendChild(td((s.timeout || 0) + (s.unanswered || 0), 'num-cell'));
        tr.appendChild(td(s.avgMs == null ? '-' : (s.avgMs / 1000).toFixed(1) + '秒', 'num-cell'));
        body.appendChild(tr);
      });
    }

    // 並べ替え
    document.querySelectorAll('#questionsTable th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.qsort;
        if (currentQSort.key === key) currentQSort.order = currentQSort.order === 'asc' ? 'desc' : 'asc';
        else currentQSort = { key, order: key === 'rate' ? 'asc' : 'desc' };
        document.querySelectorAll('#questionsTable th.sortable').forEach(o => {
          o.classList.toggle('active', o === th);
          const icon = o.querySelector('.sort-icon');
          if (icon) icon.textContent = (o === th) ? (currentQSort.order === 'asc' ? '▲' : '▼') : '';
        });
        renderQuestionStats(currentQuestionStats);
      });
    });

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const view = btn.dataset.view;
        if (view === currentView) return;
        currentView = view;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.getElementById('gamesWrapper').style.display = view === 'games' ? '' : 'none';
        document.getElementById('questionsWrapper').style.display = view === 'questions' ? '' : 'none';
        document.querySelector('.header-controls').style.display = view === 'games' ? '' : 'none';
        if (view === 'questions' && !currentQuestionStats.length) {
          loadingState.style.display = 'block';
          currentQuestionStats = await fetchQuestionStats();
          loadingState.style.display = 'none';
          renderQuestionStats(currentQuestionStats);
        }
      });
    });

    // 統計情報を表示
    function renderStats(logs) {
      if (logs.length === 0) {
        statsDiv.innerHTML = '';
        return;
      }

      const totalGames = logs.length;
      const totalPlayers = new Set();
      const totalWinners = new Set();
      let totalQuestions = 0;

      logs.forEach(log => {
        log.participants?.forEach(p => totalPlayers.add(p));
        log.winners?.forEach(w => totalWinners.add(w));
        totalQuestions += log.questionsCount || 0;
      });

      statsDiv.innerHTML = `
        <div class="stat-card">
          <h3>ゲーム数</h3>
          <div class="value">${totalGames}</div>
        </div>
        <div class="stat-card">
          <h3>参加者</h3>
          <div class="value">${totalPlayers.size}</div>
        </div>
        <div class="stat-card">
          <h3>優勝者</h3>
          <div class="value">${totalWinners.size}</div>
        </div>
        <div class="stat-card">
          <h3>総出題数</h3>
          <div class="value">${totalQuestions}</div>
        </div>
      `;
    }

    // 検索・日付フィルタ
    function filterLogs(query, startDate, endDate, logs) {
      let filtered = logs;

      if (startDate) {
        const start = new Date(startDate).setHours(0, 0, 0, 0);
        filtered = filtered.filter(log => (log.createdAt || log.finishedAt) >= start);
      }
      if (endDate) {
        const end = new Date(endDate).setHours(23, 59, 59, 999);
        filtered = filtered.filter(log => (log.createdAt || log.finishedAt) <= end);
      }

      if (query) {
        const q = query.toLowerCase();
        filtered = filtered.filter(log =>
          log.roomId.toLowerCase().includes(q) ||
          (log.host && log.host.toLowerCase().includes(q)) ||
          log.participants?.some(p => p.toLowerCase().includes(q)) ||
          log.winners?.some(w => w.toLowerCase().includes(q)) ||
          (log.status && log.status.toLowerCase().includes(q))
        );
      }

      return filtered;
    }

    // ソート
    function sortLogs(logs, sortKey, sortOrder) {
      return [...logs].sort((a, b) => {
        let valA, valB;

        switch (sortKey) {
          case 'date':
            valA = a.createdAt || a.finishedAt; valB = b.createdAt || b.finishedAt; break;
          case 'roomId':
            valA = a.roomId; valB = b.roomId; break;
          case 'host':
            valA = a.host || (a.participants && a.participants.length > 0 ? a.participants[0] : '');
            valB = b.host || (b.participants && b.participants.length > 0 ? b.participants[0] : ''); break;
          case 'participantsCount':
            valA = a.participants ? a.participants.length : 0;
            valB = b.participants ? b.participants.length : 0; break;
          case 'winner':
            valA = a.winners ? a.winners.join(',') : '';
            valB = b.winners ? b.winners.join(',') : ''; break;
          case 'questions':
            valA = a.questionsCount || 0; valB = b.questionsCount || 0; break;
          case 'mode':
            valA = a.mode; valB = b.mode; break;
          case 'status':
            valA = a.status || ''; valB = b.status || ''; break;
          default:
            return 0;
        }

        if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
        return 0;
      });
    }

    let currentLogs = [];

    // 表示更新
    function updateView() {
      const filtered = filterLogs(searchInput.value, startDateInput.value, endDateInput.value, currentLogs);
      const sorted = sortLogs(filtered, currentSort.key, currentSort.order);
      renderTable(sorted);
      renderStats(sorted);
    }

    searchInput.addEventListener('input', updateView);
    startDateInput.addEventListener('change', updateView);
    endDateInput.addEventListener('change', updateView);

    // ソートイベント
    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const sortKey = th.dataset.sort;
        if (currentSort.key === sortKey) {
          currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
        } else {
          currentSort.key = sortKey;
          currentSort.order = 'desc';
        }
        
        document.querySelectorAll('th.sortable').forEach(el => {
          el.classList.remove('active');
          el.querySelector('.sort-icon').textContent = '';
        });
        th.classList.add('active');
        th.querySelector('.sort-icon').textContent = currentSort.order === 'asc' ? '▲' : '▼';

        updateView();
      });
    });

    // CSV エクスポート
    exportBtn.addEventListener('click', () => {
      const filtered = filterLogs(searchInput.value, startDateInput.value, endDateInput.value, currentLogs);
      const sorted = sortLogs(filtered, currentSort.key, currentSort.order);
      
      if (sorted.length === 0) {
        alert('エクスポートするログがありません');
        return;
      }

      const headers = ['日時', 'ルームID', 'ホスト', '参加人数', '優勝者', '問題数', '出題範囲', '形式', 'ステータス'];
      const rows = sorted.map(log => {
        const date = new Date(log.createdAt || log.finishedAt).toLocaleString('ja-JP');
        const participantsCount = log.participants ? log.participants.length : 0;
        const hostName = log.host || (log.participants && log.participants.length > 0 ? log.participants[0] : '-');
        const statusText = STATUS_LABEL[log.status] || '終了';

        return [
          date,
          log.roomId,
          hostName,
          participantsCount,
          log.status === 'finished' ? (log.winners?.join('; ') || '') : '',
          log.questionsCount,
          formatChapters(log.chapters),
          log.mode === 'select' ? '選択' : '入力',
          statusText
        ];
      });

      const csv = [headers, ...rows]
        .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `game-logs-${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    });

    // 初期表示
    async function init() {
      const logs = await fetchLogs();
      currentLogs = logs;
      updateView();
    }
    init();
  </script>
</body>
</html>
